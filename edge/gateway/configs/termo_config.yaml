# ===== OPC UA Gateway Mapping (EBW_SIM) =====
driver: "opcua"

connection:
  endpoint: "opc.tcp://host.docker.internal:4840/freeopcua/server/"
  namespace_uri: "http://ebw-simulator.local"
  security_mode: "None"
  security_policy: "None"
  timeouts_ms:
    connect: 5000
    session: 10000
  reconnect:
    enable: true
    min_delay_ms: 1000
    max_delay_ms: 10000

# Identidad lógica CDC del equipo
equipment_id: "DemoSite1/DemoArea1/DemoLine1/DemoCell1/EBW_SIM"

# Suscripción OPC UA
subscription:
  publishing_interval_ms: 500
  sampling_interval_ms: 200
  queue_size: 10
  discard_oldest: true
  watchdog_ms: 4000
  debounce_ms: 3000

# Política común
defaults:
  quality_on_bad: "drop"
  deadband:
    type: "none"
    value: 0
  on_change_only: false

# ===== Señales a leer =====
items:
  # --- Temperatura del proceso ---
  - name: "Temperature"
    addressing:
      node_id: "ns=2;s=Process.Temperature"
    datatype: "Double"
    cdc:
      tag: "process/temperature"
      unit: "°C"
      description: "Temperatura medida del proceso"
    overrides:
      sampling_interval_ms: 500

  # --- Setpoint del proceso ---
  - name: "Setpoint"
    addressing:
      node_id: "ns=2;s=Process.Setpoint"
    datatype: "Double"
    cdc:
      tag: "process/setpoint"
      unit: "°C"
      description: "Temperatura objetivo"
    overrides:
      on_change_only: true
      sampling_interval_ms: 1000

  # --- Estado del calefactor ---
  - name: "HeaterOn"
    addressing:
      node_id: "ns=2;s=Process.HeaterOn"
    datatype: "Boolean"
    cdc:
      tag: "process/heater_on"
      unit: "-"
      description: "Estado del calefactor"
    overrides:
      on_change_only: true
      sampling_interval_ms: 500

  # --- Presión del sistema ---
  - name: "Pressure"
    addressing:
      node_id: "ns=2;s=Process.Pressure"
    datatype: "Double"
    cdc:
      tag: "process/pressure"
      unit: "bar"
      description: "Presión interna del sistema"
    overrides:
      sampling_interval_ms: 500

  # --- Flujo ---
  - name: "FlowRate"
    addressing:
      node_id: "ns=2;s=Process.FlowRate"
    datatype: "Double"
    cdc:
      tag: "process/flowrate"
      unit: "L/s"
      description: "Flujo del circuito de refrigeración"
    overrides:
      sampling_interval_ms: 1000

  # --- Potencia eléctrica aplicada ---
  - name: "Power"
    addressing:
      node_id: "ns=2;s=Process.Power"
    datatype: "Double"
    cdc:
      tag: "process/power"
      unit: "kW"
      description: "Potencia de calefacción aplicada"
    overrides:
      sampling_interval_ms: 1000

  # --- Estado general del proceso ---
  - name: "Status"
    addressing:
      node_id: "ns=2;s=Process.Status"
    datatype: "String"
    cdc:
      tag: "process/status"
      unit: "-"
      description: "Estado textual del proceso"
    overrides:
      on_change_only: true
      sampling_interval_ms: 1000

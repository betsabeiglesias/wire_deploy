services:
  gateway:
    build: ../../gateway
    container_name: gateway_customerA
    env_file:
      - ./customerA.env
    environment:
      - TZ=Europe/Madrid
      - GATEWAY_CONFIG=/opt/suite/config/gateway.yaml
    volumes:
      - ./opt/suite/config:/opt/suite/config:ro
    restart: unless-stopped
    networks:
      - suite-central-net

  telegraf:
    image: telegraf:1.30
    container_name: telegraf_customerA
    restart: unless-stopped
    # depends_on:
      # - mosquitto
      # - influxdb
    env_file:
      - ./customerA.env
    environment:
      HOSTNAME: telegraf_customerA
    volumes:
      - ./telegraf/telegraf_customerA.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - suite-central-net

networks:
  suite-central-net:
    external: true
    name: suite-central-net

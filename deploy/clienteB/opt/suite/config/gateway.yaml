gateway:
  name: gateway-customerB
  log_level: INFO
  publisher:
    mode: mqtt
    url: tcp://host.docker.internal:1883
    topic_prefix: customerB

defaults:
  subscription:
    publishing_interval_ms: 500
    sampling_interval_ms: 200
    queue_size: 10
    discard_oldest: true

equipments:
  - items_file: /opt/suite/config/plc/customerB_flow.yaml

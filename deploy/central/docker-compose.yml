services:

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    ports:
      - "127.0.0.1:1884:1883"  # ← Solo accesible localmente
      - "127.0.0.1:9001:9001"  # ← Solo accesible localmente
    volumes:
      - ../../mosquitto/config:/mosquitto/config
      - ../../mosquitto_data:/mosquitto/data
      - ../../mosquitto_log:/mosquitto/log
    networks:
      - suite-central-net

  # telegraf:
  #   image: telegraf:1.28
  #   container_name: telegraf
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #     - influxdb
  #   volumes:
  #     - ../../telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
  #   environment:
  #     - HOSTNAME=telegraf
  #     - INFLUX_TOKEN=3A4mKftLGbbRNS29Eau3qVj_CwAwAVbFKlmggyelTK0AOQ_m1Di1Joki0boWjzVZFs49an2Z8xf0bwngaiswJw==
  #   networks:
  #     - suite-central-net

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin1234
      - DOCKER_INFLUXDB_INIT_ORG=acme
      - DOCKER_INFLUXDB_INIT_BUCKET=scada
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - suite-central-net

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=django1234
      - POSTGRES_DB=industry4_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - suite-central-net

  # ---------- BACKEND CORE ----------
  django-api:
    build: ../../django-api
    container_name: django-api
    volumes:
      - ../../django-api:/app
      - ../../opt/suite/config:/opt/suite/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Madrid
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=industry4_v2
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=django1234
      - DOCKER_HOST=unix:///var/run/docker.sock
      - INFLUX_URL=http://influxdb:8086
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mosquitto
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - suite-central-net


  # ---------- FRONTEND ----------
  frontend:
    build: ../../frontend
    container_name: frontend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://django-api:8000
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - django-api
    networks:
      - suite-central-net

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  postgres_data_v2:

networks:
  suite-central-net:
    driver: bridge
    name: suite-central-net


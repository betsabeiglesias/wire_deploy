services:
  gateway:
    build: ../../edge/gateway
    container_name: gateway_customerA
    env_file:
      - ./customerA.env
    environment:
      - TZ=Europe/Madrid
      - GATEWAY_CONFIG=/opt/suite/config/gateway.yaml
    volumes:
      - ./opt/suite/config:/opt/suite/config:ro
    restart: unless-stopped
    networks:
      - suite-central-net

  writer-mssql:
    build: ../../edge/writer_mssql
    container_name: writer_customerA
    env_file:
      - ./customerA.env
    depends_on:
      - mosquitto
      - sqlserver
    restart: unless-stopped
    networks:
      - suite-central-net

  # ---------- HISTORIAN API ----------
  historian:
    build: ../../edge/historian
    container_name: historian_customerA
    env_file:
      - ./customerA.env         # hereda MSSQL_HOST, MSSQL_DB, MSSQL_USER, MSSQL_PASSWORD, MSSQL_DRIVER
    depends_on:
      - sqlserver
    ports:
      - "${HISTORIAN_PORT:-8010}:8000"
    restart: unless-stopped
    networks:
      - suite-central-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_customerA
    env_file:
      - ./customerA.env
    ports:
      - "1433:1433"   # solo en dev
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - suite-central-net

  # ---------- MOSQUITTO ----------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name:  mosquitto_customerA
    ports:
      - "127.0.0.1:1884:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto:/mosquitto
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - suite-central-net

  redis:
    image: redis:7
    container_name: redis_customerA
    restart: unless-stopped
    networks:
      - suite-central-net

  mqtt_bridge:
    build:
      context: ../../edge/core_backend
    container_name: mqtt_bridge_customerA
    command: python -m mqtt_bridge.run
    env_file:
      - ./customerA.env
    environment:
      - ENABLE_DIRECT_CENTRAL_REDIS_REPLICATION=false
    depends_on:
      - mosquitto
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net

  redis-bridge:
    build:
      context: ../../edge/core_backend
    container_name: redis_bridge_customerA
    command: python -m realtime.redis_bridge
    env_file:
      - ./customerA.env
    environment:
      - LOCAL_REDIS_HOST=redis_customerA
      - LOCAL_REDIS_PORT=6379

      # 🔥 Redis CENTRAL (no local)
      - CENTRAL_REDIS_HOST=wire-deploy-redis
      - CENTRAL_REDIS_PORT=6379

      # Identidad del cliente
      - TENANT_ID=customerA
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net

  core-backend:
    build:
      context: ../../edge/core_backend
    container_name: core-backendA
    volumes:
      - ../../edge/core_backend:/app
      - ./opt:/opt
    env_file:
      - ./customerA.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Madrid
    ports:
      - "8001:8000"   # 🔥 OJO: puerto distinto al central
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net


  edge-config-sync:
    build:
      context: ../../edge/core_backend
    container_name: edge_config_sync
    command: python -m edge_config.run
    env_file:
      - ./customerA.env
    # RETOMAR EL HARCODEO
    environment:
      - GATEWAY_CONTAINER_NAME=gateway_customerA        # ← nombre via env
      - SUITE_CONFIG_DIR=/opt/suite/config              # ← ruta config
    volumes:
      - ./opt/suite/config:/opt/suite/config            # ← mismo volumen que gateway
      - /var/run/docker.sock:/var/run/docker.sock       # ← para poder hacer docker restart
    restart: unless-stopped
    networks:
      - suite-central-net

networks:
  suite-central-net:
    external: true
    name: wire-net


volumes:
  sqlserver_data:
  mosquitto_data:
  mosquitto_log:

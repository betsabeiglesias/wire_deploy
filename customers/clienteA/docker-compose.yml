services:
  gateway:
    build: ../../edge/gateway
    container_name: gateway_${TENANT}
    env_file:
      - ./customerA.env
    environment:
      - TZ=${TZ}
      - GATEWAY_CONFIG=/opt/suite/config/gateway.yaml
    volumes:
      - ./opt/suite/config:/opt/suite/config:ro
    restart: unless-stopped
    networks:
      - suite-central-net

  writer-mssql:
    build: ../../edge/writer_mssql
    container_name: writer_${TENANT}
    env_file:
      - ./customerA.env
    depends_on:
      - mosquitto
      - sqlserver
    restart: unless-stopped
    networks:
      - suite-central-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_${TENANT}
    env_file:
      - ./customerA.env
    ports:
      - "${HOST_PORT_MSSQL}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - suite-central-net

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto_${TENANT}
    ports:
      - "127.0.0.1:${HOST_PORT_MOSQUITTO}:1883"
      - "127.0.0.1:${HOST_PORT_MOSQUITTO_WS}:9001"
    volumes:
      - ./mosquitto:/mosquitto
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - suite-central-net

  redis:
    image: redis:7
    container_name: redis_${TENANT}
    restart: unless-stopped
    networks:
      - suite-central-net

  mqtt_bridge:
    build:
      context: ../../edge/core_backend
    container_name: mqtt_bridge_${TENANT}
    command: python -m mqtt_bridge.run
    env_file:
      - ./customerA.env
    depends_on:
      - mosquitto
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net

  redis-bridge:
    build:
      context: ../../edge/core_backend
    container_name: redis_bridge_${TENANT}
    command: python -m realtime.redis_bridge
    env_file:
      - ./customerA.env
    environment:
      - LOCAL_REDIS_HOST=redis_${TENANT}
      - LOCAL_REDIS_PORT=6379
      - CENTRAL_REDIS_HOST=${CENTRAL_REDIS_HOST}
      - CENTRAL_REDIS_PORT=${CENTRAL_REDIS_PORT}
      - TENANT_ID=${TENANT}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net

  core-backend:
    build:
      context: ../../edge/core_backend
    container_name: core-backend_${TENANT}
    volumes:
      - ../../edge/core_backend:/app
      - ../opt/suite/config:/opt/suite/config
    env_file:
      - ./customerA.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
    ports:
      - "${HOST_PORT_BACKEND}:8000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - suite-central-net

networks:
  suite-central-net:
    external: true
    name: ${NETWORK_NAME}

volumes:
  sqlserver_data:
    name: ${TENANT}_sqlserver_data
  mosquitto_data:
    name: ${TENANT}_mosquitto_data
  mosquitto_log:
    name: ${TENANT}_mosquitto_log
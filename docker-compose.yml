name: wire-deploy

services:
  # ---------- DATABASE ----------
  postgres:
    image: postgres:16
    container_name: wire-deploy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - suite-central-net

  # ---------- REDIS CENTRAL ----------
  redis-central:
    image: redis:7
    container_name: redis-central
    restart: unless-stopped
    volumes:
      - redis_central_data:/data
    networks:
      - suite-central-net

  redis-stream-consumer:
    build:
      context: ./django-api
    command: python -m realtime.redis_stream_consumer
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-central
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - redis-central
    networks:
      - suite-central-net

  # ---------- BACKEND CORE (HTTP) ----------
  django-api:
    build:
      context: ./django-api
    container_name: django-api
    volumes:
      - ./django-api:/app
      - ./opt/suite/config:/opt/suite/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis-central
      - REDIS_PORT=6379
    ports:
      - "${DJANGO_PORT}:8000"
    depends_on:
      - postgres
      - redis-central
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - suite-central-net

  # ---------- BACKEND CORE (WEBSOCKET) ----------
  django-ws:
    build:
      context: ./django-api
    container_name: django-ws
    command: daphne -b 0.0.0.0 -p 8002 core.asgi:application
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
      - REDIS_HOST=redis-central
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis-central
    networks:
      - suite-central-net

  # ---------- FRONTEND ----------
  frontend:
    build: ./frontend
    container_name: wire-deploy-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://django-api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - django-api
    networks:
      - suite-central-net

# ---------- VOLUMES ----------
volumes:
  postgres_data_v2:
  redis_central_data:

# ---------- NETWORKS ----------
networks:
  suite-central-net:
    driver: bridge
    name: suite-central-net
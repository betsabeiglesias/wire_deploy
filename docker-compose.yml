name: ${COMPOSE_PROJECT_NAME} #(usa el nombre del .env)

services:
  # ---------- DATABASE ----------
  postgres:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME}-postgres #(dinámico)
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST}:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - project-net # (nombre de red interna genérico)

  # ---------- REDIS CENTRAL ----------
  redis-central:
    image: redis:7
    container_name: ${COMPOSE_PROJECT_NAME}-redis #(dinámico)
    restart: unless-stopped
    volumes:
      - redis_data:/data 
    networks:
      - project-net # (nombre de red interna genérico)

  redis-stream-consumer:
    build:
      context: ./django-api
    container_name: ${COMPOSE_PROJECT_NAME}-redis-consumer 
    command: python -m realtime.redis_stream_consumer
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-central
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - redis-central
    networks:
      - project-net # (nombre de red interna genérico)

  # ---------- BACKEND CORE (HTTP) ----------
  django-api:
    build:
      context: ./django-api
    container_name: ${COMPOSE_PROJECT_NAME}-django-api 
    volumes:
      - ./django-api:/app
      - ./opt/suite/config:/opt/suite/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis-central
    ports:
      - "${DJANGO_PORT}:8000"
    depends_on:
      - postgres
      - redis-central
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - project-net # (nombre de red interna genérico)

  # ---------- BACKEND CORE (WEBSOCKET) ----------
  django-ws:
    build:
      context: ./django-api
    container_name: ${COMPOSE_PROJECT_NAME}-django-ws 
    command: daphne -b 0.0.0.0 -p 8002 core.asgi:application
    ports:
      - "${WS_PORT_HOST}:8002" # (ahora usa la variable que creamos en el .env)
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
      - REDIS_HOST=redis-central
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis-central
    networks:
      - project-net # (nombre de red interna genérico)

  # ---------- FRONTEND ----------
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME}-frontend 
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:${DJANGO_PORT}
      VITE_WS_URL: ws://localhost:${WS_PORT_HOST}

      # URLs de servicios externos (para service_urls.jsx)
      VITE_CHATBOT_URL: http://localhost:${CHATBOT_PORT}/chat
      VITE_ML_SERVICE_URL: http://localhost:${ML_PORT}/predict
      VITE_VR_SERVICE_URL: http://localhost:${VR_PORT}/
      VITE_GRAFANA_URL: http://localhost:${GRAFANA_PORT}/login
      VITE_INFLUX_URL_SIGNIN: http://localhost:${INFLUX_PORT}/signin

      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - django-api
    networks:
      - project-net # (nombre de red interna genérico)

# ---------- VOLUMES ----------
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data
# ---------- NETWORKS ----------
networks:
  project-net: # esto es el identificador interno del archivo
    driver: bridge
    name: ${NETWORK_NAME} #(el nombre real de la red en Docker viene del .env)